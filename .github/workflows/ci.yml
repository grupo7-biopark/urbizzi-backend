name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# Um novo push no mesmo PR/branch cancela a execução anterior
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verificacao:
    name: Lint, build e testes unitários
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      # O postinstall roda `prisma generate`
      - name: Instalar dependências
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Formatação
        run: npm run format:check

      - name: Build
        run: npm run build

      - name: Testes unitários com cobertura
        run: npm run test:cov

  e2e:
    name: Testes e2e
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: urbizzi
          POSTGRES_PASSWORD: urbizzi
          POSTGRES_DB: urbizzi_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U urbizzi -d urbizzi_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      JWT_SECRET: segredo-ficticio-exclusivo-do-ci-com-32-caracteres
      NODE_ENV: test
      DATABASE_URL: postgresql://urbizzi:urbizzi@localhost:5432/urbizzi_test?schema=public
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Gerar Prisma Client
        run: npm run db:generate

      - name: Aplicar migrations
        run: npm run db:deploy

      - name: Testes e2e
        run: npm run test:e2e
