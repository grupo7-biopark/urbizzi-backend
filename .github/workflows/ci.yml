name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# Um novo push no mesmo PR/branch cancela a execução anterior
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verificacao:
    name: Lint, build e testes unitários
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      # O postinstall roda `prisma generate`
      - name: Instalar dependências
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Formatação
        run: npm run format:check

      - name: Build
        run: npm run build

      - name: Testes unitários com cobertura
        run: npm run test:cov

  e2e:
    name: Testes e2e
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: urbizzi
          POSTGRES_PASSWORD: urbizzi
          POSTGRES_DB: urbizzi_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U urbizzi -d urbizzi_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      S3_ACCESS_KEY_ID: GK0123456789abcdef0123456789abcdef
      S3_SECRET_ACCESS_KEY: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
      S3_ENDPOINT: http://localhost:3900
      JWT_SECRET: segredo-ficticio-exclusivo-do-ci-com-32-caracteres
      MAILPIT_E2E: 'true'
      NODE_ENV: test
      DATABASE_URL: postgresql://urbizzi:urbizzi@localhost:5432/urbizzi_test?schema=public
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Gerar Prisma Client
        run: npm run db:generate

      - name: Aplicar migrations
        run: npm run db:deploy

      - name: Subir Garage e aguardar inicialização dos buckets
        run: docker compose up -d --build --wait --wait-timeout 120 garage

      - name: Subir Mailpit
        run: |
          docker compose up -d mailpit
          for tentativa in $(seq 1 30); do
            if curl --fail --silent http://localhost:8025/api/v1/messages > /dev/null; then exit 0; fi
            sleep 1
          done
          exit 1

      - name: Testes e2e
        run: npm run test:e2e

      - name: Validar comandos de seed e repetição
        run: |
          npm run db:seed
          npx prisma db seed
          npm run db:seed:dev
          npx prisma db seed -- --development
        env:
          NODE_ENV: development
          SEED_ADMIN_EMAIL: admin.cli@desenvolvimento.example
          SEED_ADMIN_SENHA: SenhaFicticiaExclusivaDoCI123!
          SEED_DEV_SENHA: OutraSenhaFicticiaExclusivaDoCI123!

      - name: Encerrar Garage
        if: always()
        run: docker compose down
